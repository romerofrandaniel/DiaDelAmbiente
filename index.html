<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Día Mundial del Ambiente</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#0b5d1e,#2e8b57);
    color:white;
    min-height:100vh;
}

.pantalla{
    display:none;
    min-height:100vh;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    padding:20px;
}

.activa{
    display:flex;
}

h1{
    margin-bottom:30px;
    text-align:center;
}

.opciones{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
    max-width:900px;
}

.opciones img{
    width:100%;
    max-width:350px;
    border-radius:20px;
    cursor:pointer;
    border:5px solid transparent;
    transition:.3s;
}

.opciones img:hover{
    transform:scale(1.05);
    border-color:white;
}

.formulario{
    width:100%;
    max-width:500px;
}

input{
    width:100%;
    padding:15px;
    margin-bottom:15px;
    border:none;
    border-radius:10px;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#00c853;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#00e676;
}

.camera-container{
    position:relative;
    width:90vw;
    max-width:900px;
    aspect-ratio:3/4;
}

video{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:20px;
}

.overlay{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
}

#contador{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:120px;
    font-weight:bold;
    text-shadow:0 0 30px black;
}

#resultado{
    max-width:90%;
    border-radius:20px;
    margin-top:20px;
}

</style>
</head>
<body>

<!-- MENU -->

<div id="pantalla1" class="pantalla activa">

    <h1>🌎 Día Mundial del Ambiente</h1>

    <div class="opciones">

        <img src="img/marco1.png" onclick="seleccionarMarco('img/marco1.png')">

        <img src="img/marco2.png" onclick="seleccionarMarco('img/marco2.png')">

        <img src="img/marco3.png" onclick="seleccionarMarco('img/marco3.png')">

        <img src="img/marco4.png" onclick="seleccionarMarco('img/marco4.png')">

    </div>

</div>

<!-- DATOS -->

<div id="pantalla2" class="pantalla">

    <h1>Ingresa tus datos</h1>

    <div class="formulario">

        <input id="nombre" placeholder="Nombre completo">

        <input id="correo"
               type="email"
               placeholder="Correo electrónico">

        <button onclick="abrirCamara()">
            Continuar
        </button>

    </div>

</div>

<!-- CAMARA -->

<div id="pantalla3" class="pantalla">

    <div class="camera-container">

        <video id="video"
               autoplay
               playsinline>
        </video>

        <img id="overlay"
             class="overlay">

        <div id="contador"></div>

    </div>

</div>

<!-- RESULTADO -->

<div id="pantalla4" class="pantalla">

    <h1>¡Tu foto está lista!</h1>

    <img id="resultado">

    <br><br>

    <button onclick="descargarFoto()">
        Descargar Foto
    </button>

</div>

<script>

let marcoSeleccionado="";
let fotoFinal="";

function cambiarPantalla(id){

    document
    .querySelectorAll(".pantalla")
    .forEach(p=>p.classList.remove("activa"));

    document
    .getElementById(id)
    .classList.add("activa");
}

function seleccionarMarco(ruta){

    marcoSeleccionado=ruta;

    cambiarPantalla("pantalla2");
}

async function abrirCamara(){

    let nombre=
        document.getElementById("nombre").value;

    let correo=
        document.getElementById("correo").value;

    if(nombre==="" || correo===""){

        alert("Completa todos los datos");
        return;
    }

    cambiarPantalla("pantalla3");

    document
    .getElementById("overlay")
    .src=marcoSeleccionado;

    const stream=
        await navigator.mediaDevices.getUserMedia({
            video:true
        });

    video.srcObject=stream;

    iniciarCuenta();
}

async function iniciarCuenta(){

    const contador=
        document.getElementById("contador");

    for(let i=10;i>=1;i--){

        contador.innerHTML=i;

        await new Promise(r=>
            setTimeout(r,1000)
        );
    }

    contador.innerHTML="";

    sacarFoto();
}

async function sacarFoto(){

    const video =
        document.getElementById("video");

    const overlay =
        document.getElementById("overlay");

    const canvas =
        document.createElement("canvas");

    canvas.width = 1080;
    canvas.height = 1440;

    const ctx =
        canvas.getContext("2d");

    ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.drawImage(
        overlay,
        0,
        0,
        canvas.width,
        canvas.height
    );

    fotoFinal =
        canvas.toDataURL("image/png");

    document
        .getElementById("resultado")
        .src = fotoFinal;

    try{

        document.getElementById("contador").innerHTML =
            "Enviando...";

        const respuesta =
            await fetch(
                "http://localhost:3000/enviar-foto",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                        "application/json"
                    },

                    body:JSON.stringify({

                        nombre:
                            document
                            .getElementById(
                                "nombre"
                            ).value,

                        email:
                            document
                            .getElementById(
                                "correo"
                            ).value,

                        imagen:
                            fotoFinal

                    })
                }
            );

        const resultado =
            await respuesta.json();

        console.log(resultado);

        if(resultado.ok){

            alert(
                "✅ La foto fue enviada correctamente al correo."
            );

        }else{

            alert(
                "❌ No se pudo enviar el correo."
            );

        }

    }
    catch(error){

        console.log(error);

        alert(
            "❌ Error al conectar con el servidor."
        );

    }

    document.getElementById("contador").innerHTML =
        "";

    cambiarPantalla("pantalla4");
}
    function descargarFoto(){

    const a=
        document.createElement("a");

    a.href=fotoFinal;

    a.download=
        "DiaDelAmbiente.png";

    a.click();
}

</script>

</body>
</html>
